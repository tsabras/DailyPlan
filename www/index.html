<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a4a">
<title>Daily Eating & Activity Plan</title>
<style>
:root{--bg:#f3f8f5;--card:#fff;--tx:#17302a;--mu:#5d746b;--pr:#0f7a4a;--pl:#dff3e8;--bd:#d6e6dd;--red:#c0392b;--rl:#fdecea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#18271f;--tx:#e6f2ec;--mu:#9ab5a8;--pr:#3fcf8e;--pl:#1f3a2d;--bd:#2a4538;--red:#ff7b6b;--rl:#3a1f1c}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
header{padding:16px 16px 8px}h1{font-size:20px;margin:0}small,.mu{color:var(--mu)}
main{padding:0 12px 12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 2px}.time{font-size:13px;color:var(--mu);margin-bottom:6px}
label.i{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
label.i:first-of-type{border-top:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pr);flex:none;margin:0}
input:checked+span{text-decoration:line-through;color:var(--mu)}
.ring{display:flex;align-items:center;gap:14px}
.bar{height:10px;background:var(--pl);border-radius:6px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.big{font-size:28px;font-weight:700;color:var(--pr)}
.goals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.g{background:var(--pl);border-radius:10px;padding:8px}.g b{display:block;font-size:18px}
.warn{background:var(--rl);border-color:var(--red)}.warn h2{color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0;font:inherit;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
select,input[type=number],input[type=date]{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);flex:1;min-width:100px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600}
@media(prefers-color-scheme:dark){.btn{color:#08210f}}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;border-top:1px solid var(--bd);text-align:left;font-size:14px}
.x{background:none;border:0;color:var(--red);font-size:18px}
.week{display:flex;gap:6px;margin:8px 0}.d{flex:1;text-align:center;font-size:12px;border-radius:8px;padding:6px 0;background:var(--pl)}.d.f{background:var(--pr);color:#fff}
@media(prefers-color-scheme:dark){.d.f{color:#08210f}}
.hide{display:none}
</style>
</head>
<body>
<header><h1>♥ Daily Eating & Activity Plan</h1><small>Better blood sugar · Lower triglycerides · Healthier heart</small></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var S={};try{S=JSON.parse(localStorage.getItem('plan1')||'{}')}catch(e){}
S.c=S.c||{};S.g=S.g||[];S.t=S.t||{};
function save(){try{localStorage.setItem('plan1',JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var M=[
['☀️ Breakfast','7:00 – 9:00 AM',['2 boiled eggs or egg omelette (little oil)','Cucumber and tomato','Unsweetened tea or coffee']],
['🍽️ Lunch','12:00 – 2:00 PM',['½ – 1 cup cooked rice (adjust to your glucose)','Grilled or stewed chicken, fish or lean meat','Plenty of vegetables','1–2 tsp sunflower oil (not deep-fried)']],
['🌙 Dinner','6:00 – 8:00 PM',['Plain yogurt or boiled eggs','Cucumber, tomato, lettuce','Beans or another protein if needed']],
['🍎 Healthy snacks (if hungry)','Any time',['A handful of unsalted nuts','Plain yogurt','Fresh vegetables (cucumber, carrot)']],
['🚶 Activity','After meals',['Walk 10–15 min after a meal (build up to 30 min, 5 days/week)','Stretching or household activity','Check feet for sores or blisters']],
['🩸 Health checks','Daily',['Check fasting glucose (every morning)','Check glucose 2 hrs after a meal (some days)','Take medicines as prescribed by your doctor']],
['🚫 Avoided today','All day',['Sugary drinks and fruit juice','Sweets and cakes','White bread and large rice portions','Fried foods','Alcohol']]];
var TL=[
['Weeks 1–2',['Book a medical review (within days)','Confirm metformin dose and adherence','Discuss adding another diabetes medication if needed','Check blood pressure','Start smoking cessation plan','Begin diet and walking plan']],
['Weeks 3–6',['Continue healthy meals and portion control','Walk 30 minutes, 5 days/week (as tolerated)','Review glucose log with your clinician','Recheck fasting triglycerides (as advised)','Adjust medications if needed']],
['Weeks 8–12',['Repeat HbA1c (around 3 months)','Recheck lipid profile and liver enzymes','Review blood pressure, weight and kidney screening (eGFR & urine test)','Assess progress and adjust plan with your clinician']]];
var tab='today';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function chk(key,txt){return '<label class="i"><input type="checkbox" data-k="'+key+'" '+(S.c[key]?'checked':'')+'><span>'+esc(txt)+'</span></label>'}
function pct(){var n=0,t=0,d=today();M.forEach(function(m,i){m[2].forEach(function(_,j){t++;if(S.c[d+'|'+i+'|'+j])n++})});return[n,t]}
function weekStrip(){var h='',now=new Date();for(var k=6;k>=0;k--){var x=new Date(now);x.setDate(now.getDate()-k);var ds=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');var any=Object.keys(S.c).some(function(q){return q.indexOf(ds+'|')===0&&S.c[q]});h+='<div class="d '+(any?'f':'')+'">'+'SMTWTFS'[x.getDay()]+'<br>'+x.getDate()+'</div>'}return h}
function view(){
var h='';
if(tab==='today'){var p=pct(),pc=Math.round(p[0]/p[1]*100);
h+='<div class="card"><div class="ring"><div class="big" id="pc">'+pc+'%</div><div style="flex:1"><b>Today’s plan</b><div class="bar"><i id="pb" style="width:'+pc+'%"></i></div><small class="mu">'+p[0]+' of '+p[1]+' done · '+new Date().toDateString()+'</small></div></div><div class="week">'+weekStrip()+'</div></div>';
M.forEach(function(m,i){h+='<div class="card"><h2>'+m[0]+'</h2><div class="time">'+m[1]+'</div>'+m[2].map(function(t,j){return chk(today()+'|'+i+'|'+j,t)}).join('')+'</div>'});
h+='<div class="card"><small class="mu">Healthy food isn’t expensive. It’s a choice. You can do it!</small></div>'}
if(tab==='log'){
h+='<div class="card"><h2>Glucose log</h2><div class="row"><input type="date" id="gd" value="'+today()+'"><select id="gt"><option>Fasting</option><option>2 hrs after meal</option></select></div><div class="row"><input type="number" id="gv" inputmode="decimal" placeholder="mg/dL"><button class="btn" onclick="addG()">Add</button></div></div>';
h+='<div class="card"><table><tr><th>Date</th><th>Type</th><th>mg/dL</th><th></th></tr>';
S.g.slice().sort(function(a,b){return b.d<a.d?-1:1}).forEach(function(r){h+='<tr><td>'+esc(r.d)+'</td><td>'+esc(r.t)+'</td><td><b>'+esc(r.v)+'</b></td><td><button class="x" onclick="delG('+r.id+')">✕</button></td></tr>'});
if(!S.g.length)h+='<tr><td colspan="4" class="mu">No readings yet. Share this log with your doctor at your review.</td></tr>';
h+='</table></div>'}
if(tab==='time'){h+='<div class="card"><h2>8–12 week timeline</h2><small class="mu">Tick off each step as you complete it.</small></div>';
TL.forEach(function(w,i){var d=w[1].filter(function(_,j){return S.t[i+'|'+j]}).length;h+='<div class="card"><h2>'+w[0]+' <small class="mu">('+d+'/'+w[1].length+')</small></h2>'+w[1].map(function(t,j){return chk('T'+i+'|'+j,t)}).join('')+'</div>'})}
if(tab==='info'){
h+='<div class="card"><h2>Key results (29 Oct 2026)</h2><div class="goals"><div class="g">HbA1c<b>8.88%</b><small>aim &lt; 7%</small></div><div class="g">Triglycerides<b>397 mg/dL</b><small>aim &lt; 150</small></div><div class="g">HDL<b>23.6 mg/dL</b><small>aim &gt; 40</small></div><div class="g">LDL<b>64.4 mg/dL</b><small>good level</small></div></div></div>';
h+='<div class="card"><h2>Goals</h2>'+['Control blood sugar','Lower triglycerides','Raise HDL','Maintain good LDL','Reduce heart attack & stroke risk'].map(function(x){return '<div>✅ '+x+'</div>'}).join('')+'<p class="mu">Aim for 150 minutes of moderate activity per week.</p></div>';
h+='<div class="card warn"><h2>⚠ Seek urgent medical care if you have</h2><ul><li>Severe, persistent upper abdominal pain (especially with vomiting)</li><li>Chest pain, shortness of breath, cold sweating</li><li>Sudden weakness, facial drooping or difficulty speaking (possible stroke)</li></ul></div>';
h+='<div class="card"><h2>Remember</h2><ul><li>Keep taking atorvastatin as prescribed.</li><li>Do not start new diabetes or triglyceride medication on your own.</li><li>Your doctor will advise if aspirin is appropriate (based on your overall risk).</li></ul></div>';
h+='<div class="card"><button class="btn" onclick="if(confirm(\'Erase all ticks and glucose readings?\')){S={c:{},g:[],t:{}};save();render()}">Reset all data</button></div>'}
return h}
function render(){document.getElementById('app').innerHTML=view();
var T=[['today','📋','Today'],['log','🩸','Glucose'],['time','📅','Timeline'],['info','ℹ️','Info']];
document.getElementById('nav').innerHTML=T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
function go(t){tab=t;render();window.scrollTo(0,0)}
function addG(){var v=document.getElementById('gv').value;if(!v)return;S.g.push({id:Date.now(),d:document.getElementById('gd').value||today(),t:document.getElementById('gt').value,v:v});save();render()}
function delG(id){S.g=S.g.filter(function(r){return r.id!==id});save();render()}
document.addEventListener('change',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;
if(k.charAt(0)==='T'){S.t[k.slice(1)]=e.target.checked}S.c[k]=e.target.checked;save();if(tab==='today'){var p=pct(),pc=Math.round(p[0]/p[1]*100);document.getElementById('pc').textContent=pc+'%';document.getElementById('pb').style.width=pc+'%'}else render()});
render();
</script>
</body>
</html>
